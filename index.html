body{

.option.selected{

.option.correct{

.score{

let i=0;
let score=0;
let answers=[];
let locked=false;
let timerId=null;
let seconds=30;
let timePerQuestion=30;

function renderSetup(){

document.getElementById('app').innerHTML=`

<h1>Quiz — Testes de Software</h1>

<p class="muted">
As perguntas e alternativas serão embaralhadas. 
O tempo será contado separadamente em cada questão.
</p>

<div class="setup">

<label>
Tempo por questão

<select id="timeSelect">
<option value="15">15 segundos</option>
<option value="30" selected>30 segundos</option>
<option value="45">45 segundos</option>
<option value="60">60 segundos</option>
</select>

</label>

<button class="nav" onclick="startQuiz()">
Começar quiz →
</button>

</div>

`;

}

function startQuiz(){

timePerQuestion=
Number(document.getElementById('timeSelect').value);

i=0;
score=0;
answers=[];

render();

}

function render(){

clearInterval(timerId);

const q=questions[i];

seconds=timePerQuestion;

document.getElementById('app').innerHTML=`

<div class="top">

<div>

<h1>Quiz — Testes de Software</h1>

<div class="muted">
Questão ${i+1} de ${questions.length}
</div>

</div>

<div class="stats">

<div class="pill">
Acertos: ${score}
</div>

<div class="pill timer" id="timer">
⏱ ${seconds}s
</div>

</div>

</div>

<div class="progress">

<div
class="bar"
style="width:${(i/questions.length)*100}%">
</div>

</div>

<h2>${escapeHtml(q.q)}</h2>

<div id="opts">

${q.a.map((x,n)=>`

<button
class="option"
onclick="choose(${n})">

<b>${String.fromCharCode(65+n)}.</b>
${escapeHtml(x)}

</button>

`).join('')}

</div>

<div id="feedback"></div>

<button
class="nav"
id="next"
style="display:none"
onclick="next()">

${i===questions.length-1
?'Ver resultado'
:'Próxima questão'} →

</button>

`;

locked=false;

timerId=setInterval(tick,1000);

}

function tick(){

if(locked)return;

seconds--;

const el=document.getElementById('timer');

if(!el)return;

el.textContent='⏱ '+seconds+'s';

if(seconds<=10)
el.classList.add('danger');

if(seconds<=0){

clearInterval(timerId);

choose(-1);

}

}

function choose(n){

if(locked)return;

locked=true;

clearInterval(timerId);

const q=questions[i];

document
.querySelectorAll('.option')
.forEach((el,k)=>{

if(k===q.c)
el.classList.add('correct');

if(k===n && n!==q.c)
el.classList.add('wrong');

});

if(n===q.c){

score++;

answers[i]=true;

document.getElementById('feedback').innerHTML=`

<div class="feedback">

✅ <b>Correto!</b>

<br><br>

<b>Por quê?</b>
${escapeHtml(q.exp)}

</div>

`;

}

else if(n===-1){

answers[i]=false;

document.getElementById('feedback').innerHTML=`

<div class="feedback">

⏰ <b>Tempo esgotado!</b>

<br>

<b>Resposta correta:</b>
${String.fromCharCode(65+q.c)}.
${escapeHtml(q.a[q.c])}

<br><br>

<b>Por quê?</b>
${escapeHtml(q.exp)}

</div>

`;

}

else{

answers[i]=false;

document.getElementById('feedback').innerHTML=`

<div class="feedback">

❌ <b>Incorreto.</b>

<br>

<b>Resposta correta:</b>
${String.fromCharCode(65+q.c)}.
${escapeHtml(q.a[q.c])}

<br><br>

<b>Por quê?</b>
${escapeHtml(q.exp)}

</div>

`;

}

document.getElementById('next').style.display='inline-block';

document
.querySelector('.progress .bar')
.style.width=((i+1)/questions.length*100)+'%';

}

function next(){

if(i<questions.length-1){

i++;

render();

}else{

result();

}

}

function result(){

clearInterval(timerId);

const pct=
Math.round(score/questions.length*100);

let review=
questions.map((q,k)=>`

<div class="review-item">

<span class="tag ${answers[k]?'ok':'bad'}">

${answers[k]?'ACERTO':'ERRO/TEMPO'}

</span>

<div>

<b>
${k+1}. ${escapeHtml(q.q)}
</b>

</div>

${answers[k]
?''
:`

<div
class="muted"
style="margin-top:7px">

Resposta correta:
${String.fromCharCode(65+q.c)}.
${escapeHtml(q.a[q.c])}

</div>

`}

</div>

`).join('');

document.getElementById('app').innerHTML=`

<div class="result">

<h1>Resultado</h1>

<div class="score">
${score}/${questions.length}
</div>

<div class="muted">
${pct}% de aproveitamento
</div>

<button
class="nav"
onclick="renderSetup()">

Refazer quiz

</button>

</div>

<div class="review">

<h2>Revisão</h2>

${review}

</div>

`;

}

function escapeHtml(s){

return s.replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}

renderSetup();

</script>

</body>
</html>
